<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área Restrita - Somos Mulheres em Movimento</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            max-width: 400px;
            margin: 120px auto 60px auto;
            padding: 40px 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(212, 138, 133, 0.2);
            text-align: center;
        }

        .login-container h2 {
            font-family: 'DM Serif Display', serif;
            color: #2C2523;
            margin-bottom: 10px;
        }

        .login-container p {
            color: #6E5D5A;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .btn-google {
            width: 100%;
            padding: 12px;
            background-color: #ffffff;
            color: #2C2523;
            border: 1px solid rgba(110, 93, 90, 0.3);
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
        }

        .btn-google:hover {
            background-color: #fdfbf7;
            border-color: #D48A85;
        }

        .login-error {
            color: #d9534f;
            font-size: 0.85rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Login</h2>
        <p>Acesse o painel administrativo usando sua conta cadastrada.</p>

        <button id="btn-google-login" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Entrar com o Google
        </button>

        <p id="error-msg" class="login-error"></p>
    </div>

    <!-- Firebase SDK Compat Core e Auth -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

 <script>
  const firebaseConfig = {
    apiKey: "AIzaSyCEggZoP5vk1JENjO8701pAFdBIBPB8gPQ",
    authDomain: "somos-mulheres-em-movimento.firebaseapp.com",
    projectId: "somos-mulheres-em-movimento",
    storageBucket: "somos-mulheres-em-movimento.firebasestorage.app",
    messagingSenderId: "427525655209",
    appId: "1:427525655209:web:cc00a592936dbd3df9f7b8"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  const EMAILS_AUTORIZADOS = [
    "polyanadesn02@gmail.com",
    "celianaw@hotmail.com", 
    "polyanadesouzaneves2@gmail.com",
    "polyanadesouza02@gmail.com"
    "celianadavirian@gmail.com"
  ];

  const btnGoogle = document.getElementById('btn-google-login');
  const errorMsg = document.getElementById('error-msg');

  btnGoogle.addEventListener('click', async () => {
    const provider = new firebase.auth.GoogleAuthProvider();
    
    try {
      // Abre a janela de login por POPUP
      const result = await firebase.auth().signInWithPopup(provider);
      const emailUsuario = result.user.email;

      if (EMAILS_AUTORIZADOS.includes(emailUsuario)) {
        // Redireciona para o painel
        window.location.href = "configuracoes.html";
      } else {
        await firebase.auth().signOut();
        errorMsg.textContent = "Acesso negado. Este e-mail não possui permissão.";
        errorMsg.style.display = 'block';
      }
    } catch (error) {
      console.error("Erro no login:", error);
      errorMsg.textContent = "Erro ao tentar realizar o login com o Google.";
      errorMsg.style.display = 'block';
    }
  });
</script>
</body>
</html>
