<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Biblioteca - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="biblioteca.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">SOMOS MULHERES<br><span>EM MOVIMENTO</span></div>
        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </label>
        <nav class="nav-links">
            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="comunidade.html">Comunidade</a>
            <a href="eventos.html">Eventos</a>
            <a href="edicoes.html">Edições</a>
            <a href="contatos.html">Contato</a>
            <a href="configuracoes.html" class="active">Configurações</a>
        </nav>
    </header>

    <main class="admin-container">
        <div class="admin-header">
            <h1>Gerenciar Livros</h1>
            <p>Painel de controle do catálogo da biblioteca.</p>
        </div>

        <section class="admin-card">
            <h2 id="form-title">Adicionar Novo Livro</h2>
            <form id="book-form">
                <input type="hidden" id="book-id">
                <input type="hidden" id="book-cover-url">
                
                <div class="form-group">
                    <label for="book-title">Título</label>
                    <input type="text" id="book-title" class="form-control" placeholder="Ex: Mulheres em movimento" required>
                </div>

                <div class="form-group">
                    <label for="book-volume">Volume</label>
                    <input type="text" id="book-volume" class="form-control" placeholder="Ex: Vol. 1 ou Edição Especial" required>
                </div>

                <div class="form-group">
                    <label for="book-desc">Descrição</label>
                    <textarea id="book-desc" class="form-control" placeholder="Resumo do livro..." rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="book-cover-file">Capa do Livro (Selecione da Galeria)</label>
                    <input type="file" id="book-cover-file" class="form-control" accept="image/*">
                    <div id="cover-preview-container" style="margin-top: 10px; display: none;">
                        <img id="cover-preview" src="" alt="Pré-visualização" style="height: 100px; border-radius: 4px; object-fit: cover;">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" id="btn-save" class="btn-save">Salvar Livro</button>
                    <button type="button" id="btn-cancel" class="btn-cancel" style="display: none;">Cancelar</button>
                </div>
            </form>
        </section>

        <section class="admin-card">
            <h2>Livros Cadastrados</h2>
            <div id="admin-books-list" class="books-list"></div>
        </section>
    </main>

    <script type="module" src="biblioteca.js"></script>
</body>
</html>
